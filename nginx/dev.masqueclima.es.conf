server {
    listen 80;
    server_name dev.masqueclima.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.masqueclima.es;

    ssl_certificate /etc/letsencrypt/live/dev.masqueclima.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.masqueclima.es/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
