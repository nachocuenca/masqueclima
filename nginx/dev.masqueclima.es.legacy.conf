server {
    listen 80;
    listen [::]:80;
    server_name dev.masqueclima.es;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.masqueclima.es;

    root /srv/apps/masqueclima-legacy-dev/current/public;
    index index.php;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Configure these with certbot or the existing VPS certificate paths.
    ssl_certificate /etc/letsencrypt/live/dev.masqueclima.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.masqueclima.es/privkey.pem;

    client_max_body_size 10m;

    location = / {
        return 301 /es/;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* ^/(?:app|views|vendor|storage|tools|docs|ops|nginx)(?:/|$) {
        deny all;
    }

    location ~* (?:^|/)\.env$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param APP_ENV staging;
        fastcgi_param CONTACT_LOG_DIR /srv/apps/masqueclima-legacy-dev/shared/logs;
    }
}
